name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Spurensturm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Spurensturm-APK
          path: Spurensturm.apk
      - name: Als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete neueste -y --cleanup-tag || true
          gh release create neueste Spurensturm.apk --title "Spurensturm – neueste Version" --notes "Zum Installieren Spurensturm.apk antippen."
      - name: APK im Zweig 'apk' ablegen
        run: |
          mkdir /tmp/apk && cp Spurensturm.apk /tmp/apk/
          cd /tmp/apk
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Spurensturm.apk
          git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk
